<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-label="ccweb 架构">
  <defs>
    <style>
      .tw  { font: 600 19px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #FAF6F0; }
      .t   { font: 600 14.5px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #FAF6F0; }
      .s   { font: 400 12.5px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #D6D3D1; }
      .d   { font: 400 11px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #A8A29E; }
      .lab { font: 600 11px ui-monospace, 'Cascadia Mono', Consolas, monospace; fill: #CC785C; letter-spacing: 2px; }
      .url { font: 400 11px ui-monospace, 'Cascadia Mono', Consolas, monospace; fill: #78716C; }
      .icon{ stroke: #CC785C; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .line{ stroke: #57534E; stroke-width: 1.4; fill: none; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#78716C"/>
    </marker>
  </defs>

  <rect width="860" height="470" rx="18" fill="#1C1917"/>
  <rect x="56" y="44" width="26" height="2" fill="#CC785C"/>
  <text x="56" y="72" class="lab">CCWEB · ARCHITECTURE</text>
  <text x="54" y="110" class="tw">给真 Claude Code runtime 装仪表盘</text>

  <!-- ── 右上：~/.claude 配置 ── -->
  <g transform="translate(596,44)">
    <rect width="208" height="86" rx="10" fill="none" stroke="#57534E" stroke-width="1.1" stroke-dasharray="5 4"/>
    <text x="18" y="26" class="t" fill="#CC785C" font-size="12.5">~/.claude</text>
    <text x="18" y="47" class="d">memory · skills · rules · MCP</text>
    <text x="18" y="65" class="d">全套配置原样生效</text>
  </g>

  <!-- ── Browser ── -->
  <g transform="translate(56,140)">
    <rect width="340" height="120" rx="10" fill="#211D1A" stroke="#2E2A27"/>
    <rect width="340" height="30" rx="10" fill="#2A2622"/>
    <circle cx="18" cy="15" r="4" fill="#57534E"/><circle cx="33" cy="15" r="4" fill="#57534E"/><circle cx="48" cy="15" r="4" fill="#57534E"/>
    <text x="170" y="19" text-anchor="middle" class="url">127.0.0.1:3477</text>
    <text x="24" y="62" class="t">Browser · React 18</text>
    <text x="24" y="84" class="d">markdown + 代码高亮 · 工具卡片 · 审批 UI</text>
    <text x="24" y="102" class="d">指标条 · 上下文水位 · 调用轨迹时间线</text>
  </g>

  <!-- WS link -->
  <line x1="396" y1="200" x2="488" y2="200" class="line" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="442" y="188" text-anchor="middle" class="lab" letter-spacing="1">WS</text>
  <text x="442" y="222" text-anchor="middle" class="d" font-size="10">seq 对账 · 断线重连</text>

  <!-- Server -->
  <g transform="translate(488,140)">
    <rect width="316" height="120" rx="10" fill="#211D1A" stroke="#2E2A27"/>
    <text x="24" y="42" class="t">Local Server · Hono</text>
    <text x="24" y="66" class="d">Node ≥ 20 · 会话注册 · 消息队列 hold/flush</text>
    <text x="24" y="84" class="d">权限闸门 · 指标聚合 · 端点模板桥</text>
    <text x="24" y="102" class="d">凭证不出本地</text>
  </g>

  <!-- SDK link -->
  <line x1="646" y1="260" x2="646" y2="308" class="line" marker-end="url(#ar)"/>
  <text x="646" y="290" text-anchor="middle" class="lab" letter-spacing="1">AGENT SDK</text>

  <!-- Runtime -->
  <g transform="translate(488,308)">
    <rect width="316" height="112" rx="10" fill="#211D1A" stroke="#CC785C" stroke-width="1.2"/>
    <text x="24" y="42" class="t">Claude Code Runtime</text>
    <text x="24" y="66" class="d">真子进程 · SDK 流式输入模式</text>
    <text x="24" y="84" class="d">软中断 interrupt() · 树级强杀兜底</text>
    <text x="24" y="102" class="d">会话持久化于 ~/.claude/projects</text>
  </g>

  <!-- inherits link -->
  <line x1="596" y1="130" x2="596" y2="140" class="line" opacity="0"/>
  <path d="M700 130 V140 M660 130 L660 138" class="line" opacity="0"/>
  <line x1="620" y1="130" x2="620" y2="146" class="line" marker-end="url(#ar)"/>
  <text x="556" y="280" class="d" text-anchor="middle" font-size="10.5">↖ 继承全套配置</text>

  <!-- 左下：指标口径 -->
  <g transform="translate(56,290)">
    <rect width="340" height="130" rx="10" fill="none" stroke="#2E2A27"/>
    <text x="22" y="30" class="t" font-size="13">指标 · 零估算</text>
    <text x="22" y="56" class="d">轮数 / TTFT / tokens/s / 缓存命中率 / 成本</text>
    <text x="22" y="76" class="d">全部来自 SDK 原生字段：</text>
    <text x="22" y="98" class="url" fill="#CC785C" font-size="11">ttft_ms · modelUsage · total_cost_usd</text>
    <text x="22" y="118" class="d">上下文水位 &gt; 85% 主动警示</text>
  </g>
</svg>
